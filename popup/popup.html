<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixel Catch</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup">
      <button id="close-button" type="button" class="close-btn" title="Close">&times;</button>

      <section class="hero">
        <h1>Pixel Catch</h1>
        <p class="subtitle">Download YouTube videos in any resolution.</p>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Download</h2>
          <div class="panel-actions">
            <button id="open-youtube-studio-button" type="button" class="ghost">YouTube Studio</button>
            <button id="open-last-video-button" type="button" class="secondary">Open Last</button>
          </div>
        </div>

        <form id="youtube-form" class="stack-form">
          <label for="youtube-url-input">Paste YouTube URL</label>
          <input
            id="youtube-url-input"
            name="youtubeUrl"
            type="url"
            inputmode="url"
            placeholder="https://www.youtube.com/watch?v=..."
            autocomplete="off"
          />
          <div class="form-row">
            <select id="quality-select" class="quality-select">
              <option value="bestvideo[ext=mp4]+bestaudio[ext=m4a]/bestvideo+bestaudio/best">Best quality</option>
              <option value="bestvideo[height<=1080][ext=mp4]+bestaudio[ext=m4a]/best[height<=1080]">1080p</option>
              <option value="bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/best[height<=720]">720p</option>
              <option value="bestvideo[height<=480][ext=mp4]+bestaudio[ext=m4a]/best[height<=480]">480p</option>
              <option value="bestvideo[height<=360][ext=mp4]+bestaudio[ext=m4a]/best[height<=360]">360p</option>
            </select>
            <button id="download-button" type="button">Download</button>
          </div>
          <button type="submit" class="open-tab-btn secondary">Open In New Tab</button>
        </form>

        <div id="download-panel" class="download-panel hidden" aria-live="polite">
          <div class="download-panel-header">
            <span id="download-filename" class="download-filename">Downloading…</span>
            <span id="download-percent" class="download-percent">0%</span>
          </div>
          <div class="progress-track">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
          <div class="download-meta">
            <span id="download-speed"></span>
            <span id="download-eta"></span>
          </div>
          <p id="download-status" class="download-status-msg"></p>
        </div>

        <div class="recent-links">
          <p class="meta-label">Recent downloads</p>
          <ul id="recent-links-list" class="recent-links-list">
            <li class="empty-state">No videos downloaded yet.</li>
          </ul>
        </div>

        <div class="last-video-row">
          <span class="meta-label">Last:</span>
          <span id="last-video" class="last-video-label">Never</span>
        </div>
      </section>
    </main>

    <script type="module" src="./popup.js"></script>
  </body>
</html>
